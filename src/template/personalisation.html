<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissance 4</title>
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/personalisation.css">
    <link rel="stylesheet" href="./CSS/mobile.css">
</head>
    <body>
        {{template "header" .}}
        <div class="pers-visuel">
            <img src="../images/imgcss/puissance4cote2.png" alt="puissance4decote">
        </div>
        <div class="difftext pers-form">
            <h1>Choisissez la taille de la grille</h1>
            <form action="/play" method="get">
                <label for="rows">Lignes :</label>
                <input type="number" id="rows" name="rows" min="4" max="10" value="6">
                
                <label for="cols">Colonnes :</label>
                <input type="number" id="cols" name="cols" min="4" max="10" value="7">
                <br>
                <br>
                <button type="submit">Créer la grille</button>
            </form>
        </div>
    </body>
</html>
